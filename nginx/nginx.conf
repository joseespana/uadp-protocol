upstream gateway { server gateway:4000; }
upstream nova    { server nova:4001; }
upstream pulse   { server pulse:4002; }
upstream orbit   { server orbit:4003; }
upstream zinc    { server zinc:4004; }
upstream market  { server market:4005; }
upstream stream  { server stream:4006; }
upstream echo    { server echo:4007; }
upstream herald  { server herald:4008; }
upstream lyra    { server lyra:4009; }
upstream vortex  { server vortex:4010; }
upstream beacon  { server beacon:4011; }
upstream compass { server compass:4012; }
upstream flame   { server flame:4013; }
upstream atlas   { server atlas:4014; }

server {
    listen 80;
    server_name uadp.perseusoft.tech;

    # Disable buffering for SSE streams
    proxy_buffering off;
    proxy_cache off;

    # Gateway (directory) at root
    location = / {
        proxy_pass http://gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /services {
        proxy_pass http://gateway/services;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /users {
        proxy_pass http://gateway/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Services (strip prefix) ---

    location /nova/ {
        proxy_pass http://nova/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
